name: GLB visual evidence (preview only)
on:
  push:
    branches: [prep/glb-visual-review]
    paths:
      - 'scripts/review-glb-visual.mjs'
      - '.github/workflows/glb-visual-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  renders:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core@1.57.0
      - run: node scripts/audit-release-glb.mjs --audit "$RUNNER_TEMP/glb-evidence.json"
      - run: node scripts/review-glb-visual.mjs "$RUNNER_TEMP/glb-evidence.json" "$RUNNER_TEMP/glb-visual"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glb-visual-review-pending
          path: |
            ${{ runner.temp }}/glb-visual/
            ${{ runner.temp }}/glb-evidence.json
