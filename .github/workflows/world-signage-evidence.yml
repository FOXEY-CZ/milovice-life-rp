name: World signage evidence (preview only)
on:
  push:
    branches: [prep/world-signage-evidence]
    paths:
      - 'scripts/audit-world-signage.mjs'
      - 'scripts/station-forecourt-pass.js'
      - 'scripts/street-environment-reality.js'
      - 'scripts/fictional-transit.js'
      - 'scripts/fictional-signage.js'
      - '.github/workflows/world-signage-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        group: [central, west, north]
    env:
      REGION_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - shell: bash
        run: |
          set -euo pipefail
          node scripts/fictional-signage.test.mjs
          node scripts/fictional-transit.test.mjs
          node scripts/station-forecourt-pass.test.mjs
          node scripts/stage-player-package.mjs --stage "$RUNNER_TEMP/crossvex-signs"
          npm install --no-save --no-package-lock playwright-core@1.57.0
          python3 -m http.server 8080 --bind 127.0.0.1 --directory "$RUNNER_TEMP/crossvex-signs" > "$RUNNER_TEMP/sign-http.log" 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8080/credits.html >/dev/null
          node scripts/audit-world-signage.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-signage-${{ matrix.group }}
          path: ${{ runner.temp }}/world-signage-*.json
