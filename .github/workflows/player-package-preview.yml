name: Staged player package (preview only)
on:
  push:
    branches: [prep/release-license-inventory, prep/release-network-evidence, prep/release-library-notices, prep/release-gameplay-preview, prep/release-data-notices]
    paths:
      - '.github/workflows/player-package-preview.yml'
      - 'scripts/stage-player-package.mjs'
      - 'scripts/audit-release-map-data.mjs'
      - 'data/**/*.json'
      - 'scripts/release-package-check.mjs'
      - 'scripts/audit-library-notices.mjs'
      - 'credits.html'
      - 'scripts/audit-release-network.mjs'
      - 'scripts/release-network-observer.mjs'
      - 'scripts/release-network-observer.test.mjs'
      - 'scripts/release-gameplay-scenario.mjs'
      - 'index.html'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'credits.html'
      - 'scripts/stage-player-package.mjs'
      - 'scripts/audit-release-map-data.mjs'
      - 'data/**/*.json'
      - 'scripts/release-package-check.mjs'
      - 'scripts/audit-library-notices.mjs'
      - 'scripts/audit-release-network.mjs'
      - 'scripts/release-network-observer.mjs'
      - 'scripts/release-network-observer.test.mjs'
      - 'scripts/release-gameplay-scenario.mjs'
      - '.github/workflows/player-package-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staged-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Self-tests and actual staging
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stage-player-package.mjs --self-test
          node scripts/release-package-check.mjs --self-test
          node scripts/audit-release-network.mjs --self-test
          node scripts/release-network-observer.test.mjs
          node scripts/gps-voice-5331.test.mjs
          stage="$RUNNER_TEMP/crossvex-player"
          node scripts/stage-player-package.mjs --stage "$stage"
          node scripts/audit-release-map-data.mjs "$stage"
          node scripts/release-package-check.mjs --inventory "$stage" > "$RUNNER_TEMP/crossvex-inventory.json"
          for file in editor.html survey.html photo-pilot.html rebuild.html AGENTS.md DEVELOPMENT_STATUS.md README.md; do
            test ! -e "$stage/$file"
          done
          if node scripts/release-package-check.mjs --check "$stage" "$RUNNER_TEMP/crossvex-inventory.json" > "$RUNNER_TEMP/crossvex-review.log" 2>&1; then
            echo "Unreviewed inventory unexpectedly passed"; exit 1
          fi
          grep -q 'Review/evidence missing: index.html' "$RUNNER_TEMP/crossvex-review.log"
      - name: Verify complete library notices against pinned npm packages
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/crossvex-library-notices"
          mkdir -p "$work"
          npm pack three@0.160.1 --ignore-scripts --pack-destination "$work"
          npm pack leaflet@1.9.4 --ignore-scripts --pack-destination "$work"
          tar -xOf "$work/three-0.160.1.tgz" package/LICENSE > "$work/three.txt"
          tar -xOf "$work/leaflet-1.9.4.tgz" package/LICENSE > "$work/leaflet.txt"
          node scripts/audit-library-notices.mjs "$RUNNER_TEMP/crossvex-player/credits.html" "$work/three.txt" "$work/leaflet.txt"
      - name: Browser startup, map and credits from staged directory
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright-core@1.57.0
          python3 -m http.server 8080 --bind 127.0.0.1 --directory "$RUNNER_TEMP/crossvex-player" > "$RUNNER_TEMP/crossvex-http.log" 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8080/credits.html > /dev/null
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {writeFileSync} from 'node:fs';
          import {chromium} from 'playwright-core';
          import {observeReleaseNetwork} from './scripts/release-network-observer.mjs';
          import {runReleaseGameplayScenario} from './scripts/release-gameplay-scenario.mjs';
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          const errors=[],missing=[],requests=new Set();
          const base='http://127.0.0.1:8080';
          const observers=[],gameplay={};
          try {
            const page=await browser.newPage({viewport:{width:1280,height:760}});
            observers.push({scenario:'startup-map-credits',observer:observeReleaseNetwork(page)});
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('request',r=>requests.add(r.url()));
            page.on('response',r=>{if(r.url().startsWith(base+'/')&&r.status()>=400&&!r.url().endsWith('/favicon.ico'))missing.push(r.status()+' '+r.url());});
            await page.goto(base+'/',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>window.__miloviceStarted===true,null,{timeout:60000});
            await page.locator('#rp-spawn-close').waitFor({state:'visible',timeout:90000});
            await page.locator('#rp-spawn-close').click();
            assert.equal(await page.locator('html').evaluate(e=>e.classList.contains('rp-developer-mode')),false);
            assert.equal(await page.locator('#rp-camera-gps-toggle').isHidden(),true);
            await page.waitForTimeout(6500);
            await page.locator('#maplaunch').click();
            await page.locator('#osmmap .leaflet-control-attribution').waitFor({state:'visible',timeout:30000});
            assert.match(await page.locator('#osmmap .leaflet-control-attribution').innerText(),/OpenStreetMap/);
            assert.equal(await page.locator('#mapfollow-camera').isHidden(),true);
            assert.equal(await page.locator('#osmmap .leaflet-tile').count(),0);
            await page.goto(base+'/credits.html',{waitUntil:'domcontentloaded'});
            assert.equal(await page.locator('h1').textContent(),'Credits & Licenses');
            assert.deepEqual(missing,[],'Missing local staged resources');
            assert.deepEqual(errors,[],'Page errors');
            console.log('PASS staged desktop world startup, map and credits');
            const drive=await browser.newPage({viewport:{width:1280,height:760}});
            observers.push({scenario:'desktop-driving-audio',observer:observeReleaseNetwork(drive)});
            drive.on('pageerror',e=>errors.push(String(e)));
            drive.on('request',r=>requests.add(r.url()));
            drive.on('response',r=>{if(r.url().startsWith(base+'/')&&r.status()>=400&&!r.url().endsWith('/favicon.ico'))missing.push(r.status()+' '+r.url());});
            await runReleaseGameplayScenario(drive,base,gameplay);
            assert.deepEqual(missing,[],'Missing local staged resources during gameplay');
            assert.deepEqual(errors,[],'Page errors during gameplay');
            console.log('PASS staged driving and audio control scenario',JSON.stringify(gameplay));
          } finally {
            const traces=observers.map(({scenario,observer})=>({scenario,...observer.stop()}));
            writeFileSync(process.env.RUNNER_TEMP+'/crossvex-response-trace.json',JSON.stringify(traces,null,2));
            writeFileSync(process.env.RUNNER_TEMP+'/crossvex-gameplay.json',JSON.stringify(gameplay,null,2));
            console.log('Response evidence',JSON.stringify(traces.map(({scenario,summary})=>({scenario,...summary}))));
            writeFileSync(process.env.RUNNER_TEMP+'/crossvex-requests.json',JSON.stringify([...requests].sort(),null,2));
            await browser.close();
          }
          NODE
      - name: Verify exact known network URLs (preview evidence only)
        run: node scripts/audit-release-network.mjs --check "$RUNNER_TEMP/crossvex-requests.json" "$RUNNER_TEMP/crossvex-network-review.json"
      - name: Save diagnostic inventory (not a release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crossvex-preview-audit
          path: |
            ${{ runner.temp }}/crossvex-inventory.json
            ${{ runner.temp }}/crossvex-review.log
            ${{ runner.temp }}/crossvex-http.log
            ${{ runner.temp }}/crossvex-requests.json
            ${{ runner.temp }}/crossvex-network-review.json
            ${{ runner.temp }}/crossvex-response-trace.json
            ${{ runner.temp }}/crossvex-gameplay.json
          if-no-files-found: warn
