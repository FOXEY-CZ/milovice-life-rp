name: Topolova 5.149 official masonry mobile WebGL
on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 3'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/osm-topolova-masonry-5149.js'
      - 'scripts/osm-topolova-masonry-5149.test.mjs'
      - 'scripts/osm-topolova-masonry-webgl-5149.mjs'
      - 'scripts/osm-topolova-residential-5148.js'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  masonry-not-fake-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate original RUIAN and official brick-block building evidence
        run: |
          node scripts/osm-topolova-residential-5148.test.mjs
          node scripts/osm-topolova-masonry-5149.test.mjs
      - run: npm install --no-save --no-package-lock playwright-core
      - name: Mobile Chromium WebGL masonry review after 6.5-second LOD
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/milovice-http.log 2>&1 &
          node scripts/osm-topolova-masonry-webgl-5149.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topolova-official-masonry-5149
          path: browser-artifacts/topolova-official-masonry-5149-mobile.png
          if-no-files-found: ignore
