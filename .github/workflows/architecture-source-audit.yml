name: Published architecture source audit (evidence only)
on:
  push:
    branches: [prep/release-architecture-sources]
    paths:
      - '.github/workflows/architecture-source-audit.yml'
      - 'scripts/audit-architecture-sources.mjs'
      - 'docs/architecture-source-inventory.json'
      - 'data/architecture/verified-buildings.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/architecture-source-audit.yml'
      - 'scripts/audit-architecture-sources.mjs'
      - 'scripts/architecture-manifest.js'
      - 'scripts/street-architecture.js'
      - 'scripts/stage-player-package.mjs'
      - 'docs/architecture-source-inventory.json'
      - 'data/architecture/verified-buildings.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/stage-player-package.mjs --stage "$RUNNER_TEMP/crossvex-architecture"
      - run: node scripts/audit-architecture-sources.mjs --self-test "$RUNNER_TEMP/crossvex-architecture"
      - run: node scripts/audit-architecture-sources.mjs --audit "$RUNNER_TEMP/crossvex-architecture" "$RUNNER_TEMP/architecture-source-evidence.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-sources-review-pending
          path: ${{ runner.temp }}/architecture-source-evidence.json
          if-no-files-found: warn
