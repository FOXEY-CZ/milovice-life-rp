name: Full discovered Node unit regression
on:
  workflow_dispatch:
  schedule:
    - cron: '43 5 * * 0'
permissions:
  contents: read
concurrency:
  group: all-unit-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  all-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate.cjs
      - run: node scripts/dev-check.mjs --all
