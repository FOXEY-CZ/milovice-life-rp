name: Station photo WebGL smoke
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'scripts/dev-check.mjs'
      # Exact non-runtime release audit files only; all other changes still trigger.
      - 'scripts/audit-release-glb.mjs'
      - '.github/workflows/glb-release-audit.yml'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'scripts/dev-check.mjs'
      # Exact non-runtime release audit files only; all other changes still trigger.
      - 'scripts/audit-release-glb.mjs'
      - '.github/workflows/glb-release-audit.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  photo-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright test client
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-package-lock playwright-core@1.57.0
      - name: Verify source-locked platform tactile band geometry
        run: node scripts/osm-station-platform-edging-5248.test.mjs
      - name: Run Chromium WebGL station photo test
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export CHROME_BIN
          python3 -m http.server 8080 > /tmp/milovice-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node scripts/station-ticket-photo-webgl.mjs
      - name: Upload browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: station-ticket-photo-58116
          path: browser-artifacts/milovice-ticket-photo-58116*.png
          if-no-files-found: ignore
