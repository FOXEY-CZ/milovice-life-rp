name: Station photo WebGL smoke
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  photo-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright test client
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-package-lock playwright-core@1.57.0
      - name: Run Chromium WebGL station photo test
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export CHROME_BIN
          python3 -m http.server 8080 > /tmp/milovice-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node scripts/station-ticket-photo-webgl.mjs
      - name: Upload browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: station-ticket-photo-581
          path: browser-artifacts/milovice-ticket-photo-581*.png
          if-no-files-found: ignore
