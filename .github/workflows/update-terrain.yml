name: Update Milovice real terrain (ČÚZK DMR 4G)

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build_terrain.py
      - .github/workflows/update-terrain.yml

permissions:
  contents: write

jobs:
  build-terrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geospatial dependencies
        run: python -m pip install --disable-pip-version-check numpy rasterio pyproj requests
      - name: Download official ČÚZK DMR 4G and build offline height map
        run: python scripts/build_terrain.py
      - name: Commit real elevation data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/milovice-terrain.json
          if git diff --cached --quiet; then
            echo "Terrain data unchanged"
          else
            git commit -m "data: update Milovice heights from ČÚZK DMR 4G"
            git push
          fi
