name: Export expanded Milovice real terrain (ČÚZK)
on:
  workflow_dispatch:
  push:
    paths:
      - data/regions/index.json
      - scripts/build_region_terrain.py
      - .github/workflows/update-region-terrain.yml
permissions:
  contents: write
concurrency:
  group: milovice-region-terrain-export
  cancel-in-progress: true
jobs:
  terrain:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install raster dependencies
        run: python -m pip install numpy rasterio pyproj requests
      - name: Sample official ČÚZK DMR4G elevations for each city area
        run: python scripts/build_region_terrain.py
      - name: Commit regional DMR4G game-height grids
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/regions/terrain-*.json
          if git diff --cached --quiet; then
            echo "Regional terrain unchanged"
          else
            git commit -m "data: genuine DMR4G terrain heights for the rest of Milovice"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
