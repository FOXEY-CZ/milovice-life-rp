name: Export expanded Milovice real terrain (ČÚZK)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dmr-regional-review-only
  cancel-in-progress: false
jobs:
  terrain:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CROSSVEX_DMR_EVIDENCE_DIR: ${{ runner.temp }}/dmr-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geospatial dependencies
        run: python -m pip install --disable-pip-version-check numpy rasterio pyproj requests
      - name: Prepare external evidence directory
        run: mkdir -p "$CROSSVEX_DMR_EVIDENCE_DIR"
      - name: Obtain official elevations and candidate evidence
        run: python scripts/build_region_terrain.py
      - name: Retain candidate data and source evidence for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dmr-regional-review-only
          path: ${{ runner.temp }}/dmr-evidence/
          if-no-files-found: error
          retention-days: 90
