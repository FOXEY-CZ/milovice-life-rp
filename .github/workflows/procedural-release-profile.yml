name: Procedural distribution alternative (preview only)
on:
  push:
    branches: [prep/procedural-release-profile]
  pull_request:
    branches: [main]
    paths:
      - 'scripts/stage-procedural-profile.mjs'
      - 'scripts/review-procedural-release-profile.mjs'
      - '.github/workflows/procedural-release-profile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - shell: bash
        run: |
          set -euo pipefail
          node scripts/stage-player-package.mjs --self-test
          stage="$RUNNER_TEMP/crossvex-procedural"
          node scripts/stage-player-package.mjs --stage-procedural-preview "$stage"
          node scripts/audit-release-map-data.mjs "$stage"
          node scripts/release-package-check.mjs --inventory "$stage" > "$RUNNER_TEMP/procedural-inventory.json"
          if node scripts/release-package-check.mjs --check "$stage" "$RUNNER_TEMP/procedural-inventory.json"; then exit 1; fi
          npm install --no-save --no-package-lock playwright-core@1.57.0
          python3 -m http.server 8080 --bind 127.0.0.1 --directory "$stage" > "$RUNNER_TEMP/procedural-http.log" 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8080/credits.html >/dev/null
          node scripts/review-procedural-release-profile.mjs "$stage"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: procedural-preview-unapproved-inventory
          path: ${{ runner.temp }}/procedural-inventory.json
