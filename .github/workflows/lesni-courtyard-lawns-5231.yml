name: Milovice 5.231 authentic Lesni courtyard lawns mobile WebGL
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/osm-lesni-courtyard-lawns-5231.js'
      - 'scripts/osm-lesni-courtyard-lawns-5231.test.mjs'
      - 'scripts/osm-lesni-courtyard-lawns-webgl-5231.mjs'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source-and-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Three exact original OSM polygons and previous pedestrian regression
        run: |
          node scripts/osm-sportovni-footway-network-5230.test.mjs
          node scripts/osm-lesni-courtyard-lawns-5231.test.mjs
      - run: npm install --no-save --no-package-lock playwright-core
      - name: Real mobile Chromium SwiftShader WebGL and grass LOD
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/milovice-http.log 2>&1 &
          node scripts/osm-lesni-courtyard-lawns-webgl-5231.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lesni-courtyard-lawns-5231
          path: browser-artifacts/lesni-courtyard-lawns-5231-mobile.png
          if-no-files-found: ignore
