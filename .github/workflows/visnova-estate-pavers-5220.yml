name: Milovice 5.220 two original Višňová paved estate sidewalks WebGL
on:
  push:
    paths:
      - index.html
      - data/regions/mlada.json
      - scripts/osm-visnova-estate-pavers-5220.js
      - scripts/osm-visnova-estate-pavers-5220.test.mjs
      - scripts/osm-visnova-estate-pavers-webgl-5220.mjs
      - scripts/osm-visnova-seven-floor-row-5219.test.mjs
      - .github/workflows/visnova-estate-pavers-5220.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original two OSM paved sidewalks and prior source-locked Višňová row
        run: |
          node scripts/osm-visnova-seven-floor-row-5219.test.mjs
          node scripts/osm-visnova-estate-pavers-5220.test.mjs
      - run: npm install --no-save --no-package-lock playwright-core
      - name: Real mobile Chromium / SwiftShader WebGL 372m sidewalks + LOD
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/milovice-http.log 2>&1 &
          node scripts/osm-visnova-estate-pavers-webgl-5220.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visnova-estate-pavers-5220
          path: browser-artifacts/visnova-estate-pavers-5220-mobile.png
          if-no-files-found: ignore
