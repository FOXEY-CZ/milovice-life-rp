name: Milovice 5.217 original Višňová mapped wall and roof colours WebGL
on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * 1'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/osm-visnova-tagged-colors-5217.js'
      - 'scripts/osm-visnova-tagged-colors-5217.test.mjs'
      - 'scripts/osm-visnova-tagged-colors-webgl-5217.mjs'
      - 'scripts/osm-visnova-refuge-5216.test.mjs'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source-and-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original OSM facade and roof color source + mapped refuge
        run: |
          node scripts/osm-visnova-refuge-5216.test.mjs
          node scripts/osm-visnova-tagged-colors-5217.test.mjs
      - run: npm install --no-save --no-package-lock playwright-core
      - name: Mobile Chromium real WebGL source colour and existing 3D building
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/milovice-http.log 2>&1 &
          node scripts/osm-visnova-tagged-colors-webgl-5217.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visnova-tagged-colors-5217
          path: browser-artifacts/visnova-tagged-colors-5217-mobile.png
          if-no-files-found: ignore
