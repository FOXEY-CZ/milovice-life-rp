name: Milovice 5.225 real Lesni pedestrian chain mobile WebGL
on:
  push:
    paths:
      - index.html
      - data/regions/mlada.json
      - scripts/osm-lesni-walk-chain-5225.js
      - scripts/osm-lesni-walk-chain-5225.test.mjs
      - scripts/osm-lesni-walk-chain-webgl-5225.mjs
      - scripts/osm-lesni-paved-service-spur-5224.test.mjs
      - .github/workflows/lesni-walk-chain-5225.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact OSM three-junction sidewalk route and 5.224 regression
        run: |
          node scripts/osm-lesni-paved-service-spur-5224.test.mjs
          node scripts/osm-lesni-walk-chain-5225.test.mjs
      - run: npm install --no-save --no-package-lock playwright-core
      - name: Actual mobile WebGL neutral sidewalks + unchanged unmarked crossing
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/milovice-http.log 2>&1 &
          node scripts/osm-lesni-walk-chain-webgl-5225.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lesni-walk-chain-5225
          path: browser-artifacts/lesni-walk-chain-5225-mobile.png
          if-no-files-found: ignore
