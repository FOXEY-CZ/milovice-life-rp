name: Browser smoke test (Milovice RP)
on:
  push:
    paths:
      - index.html
      - editor.html
      - scripts/editor_smoke.mjs
      - scripts/mapillary-discovery.js
      - scripts/mapillary-discovery-ui.js
      - scripts/mapillary-discovery.test.mjs
      - scripts/architecture-manifest.js
      - scripts/architecture-manifest.test.mjs
      - scripts/street-architecture.js
      - scripts/street-photo-block.js
      - scripts/street-photo-block.test.mjs
      - scripts/performance-governor.js
      - scripts/performance-governor.test.mjs
      - data/architecture/verified-buildings.json
      - data/milovice-osm.json
      - data/milovice-terrain.json
      - scripts/browser_smoke.mjs
      - scripts/station-roof-geometry.js
      - scripts/station-roof-geometry.test.mjs
      - scripts/station-roof-seams.js
      - scripts/station-roof-seams.test.mjs
      - scripts/station-roof-eaves.js
      - scripts/station-roof-eaves.test.mjs
      - scripts/skolska-roof.js
      - scripts/skolska-roof.test.mjs
      - scripts/city-roof-geometry.js
      - scripts/city-roof-geometry.test.mjs
      - scripts/building-audit-queue.test.mjs
      - scripts/hero-architecture.js
      - data/architecture/building-audit-queue.json
      - .github/workflows/browser-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright runtime
        run: npm install --no-save --no-package-lock playwright-core
      - name: Start local GitHub Pages equivalent and run Chromium WebGL smoke test
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/milovice-http.log 2>&1 &
          node scripts/browser_smoke.mjs
          node scripts/editor_smoke.mjs
      - name: Attach browser screenshot if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milovice-city-browser-shot
          path: browser-artifacts/
          if-no-files-found: ignore
