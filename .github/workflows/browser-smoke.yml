  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright runtime
        run: npm install --no-save --no-package-lock playwright-core
      - name: Start local GitHub Pages equivalent and run Chromium WebGL smoke test
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/milovice-http.log 2>&1 &
          node scripts/osm-prubezna-renovation-webgl-5134.mjs
          node scripts/osm-prubezna-road-webgl-5135.mjs
          node scripts/osm-prubezna-links-webgl-5137.mjs
          node scripts/osm-prubezna-bends-webgl-5138.mjs
          node scripts/osm-sportovni-sidewalk-webgl-5139.mjs
          node scripts/osm-sportovni-ruian-panels-webgl-5140.mjs
          node scripts/osm-sportovni-estate-walk-webgl-5141.mjs
          node scripts/osm-sportovni-entrances-webgl-5143.mjs
          node scripts/osm-sportovni-basketball-webgl-5142.mjs
          node scripts/osm-ruian-party-walls-webgl-5133.mjs
          node scripts/browser_smoke.mjs
          node scripts/osm-armadni-trolleys-webgl-5120.mjs
          node scripts/osm-armadni-clinic-entry-webgl-5121.mjs
          node scripts/osm-clinic-forecourt-webgl-5123.mjs
          node scripts/osm-clinic-storefronts-webgl-5124.mjs
          node scripts/osm-clinic-parking-inlays-webgl-5125.mjs
          node scripts/osm-tyrsova-armadni-junction-webgl-5131.mjs

          node scripts/editor_smoke.mjs
          node scripts/photo-pilot-smoke.mjs
      - name: Attach browser screenshot if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milovice-city-browser-shot
          path: browser-artifacts/
          if-no-files-found: ignore
