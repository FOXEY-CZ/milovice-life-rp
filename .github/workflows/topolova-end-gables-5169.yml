name: Milovice 5.169 Topolova source-locked end gable cleanup
on:
  push:
    paths:
      - index.html
      - scripts/osm-topolova-end-gables-5169.js
      - scripts/osm-topolova-end-gables-5169.test.mjs
      - scripts/osm-topolova-end-gables-webgl-5169.mjs
      - .github/workflows/topolova-end-gables-5169.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original RUIAN ends and 5.160-5.161 regressions
        run: |
          node scripts/osm-topolova-end-gables-5169.test.mjs
          node scripts/osm-topolova-estimated-facades-5161.test.mjs
          node scripts/osm-topolova-continuous-hip-5160.test.mjs
          node scripts/osm-topolova-drawing-614615-5159.test.mjs
      - run: npm install --no-save --no-package-lock playwright-core
      - name: Mobile Chromium WebGL post-LOD and full block
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/milovice-http.log 2>&1 &
          node scripts/osm-topolova-end-gables-webgl-5169.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topolova-end-gables-5169
          path: browser-artifacts/topolova-end-gables-5169-mobile.png
          if-no-files-found: ignore
