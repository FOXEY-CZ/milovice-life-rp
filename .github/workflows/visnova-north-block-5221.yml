name: Milovice 5.221 original 7-floor north Visnova RUIAN facade mobile WebGL
on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 4'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/osm-visnova-north-block-5221.js'
      - 'scripts/osm-visnova-north-block-5221.test.mjs'
      - 'scripts/osm-visnova-north-block-webgl-5221.mjs'
      - 'scripts/osm-visnova-estate-pavers-5220.test.mjs'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source-and-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-lock original RUIAN 7-floor building and preserve 5.220 sidewalks
        run: |
          node scripts/osm-visnova-estate-pavers-5220.test.mjs
          node scripts/osm-visnova-north-block-5221.test.mjs
      - run: npm install --no-save --no-package-lock playwright-core
      - name: Actual mobile Chromium WebGL facade and LOD
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/milovice-http.log 2>&1 &
          node scripts/osm-visnova-north-block-webgl-5221.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visnova-north-block-5221
          path: browser-artifacts/visnova-north-block-5221-mobile.png
          if-no-files-found: ignore
