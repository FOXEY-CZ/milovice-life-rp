name: Staged mobile preview (evidence only)
on:
  push:
    branches: [prep/release-mobile-candidate]
    paths:
      - '.github/workflows/player-mobile-preview.yml'
      - 'scripts/release-mobile-scenario.mjs'
      - 'scripts/run-release-mobile-preview.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage and exercise touchscreen controls
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stage-player-package.mjs --stage "$RUNNER_TEMP/crossvex-mobile"
          node scripts/audit-release-map-data.mjs "$RUNNER_TEMP/crossvex-mobile"
          npm install --no-save --no-package-lock playwright-core@1.57.0
          python3 -m http.server 8080 --bind 127.0.0.1 --directory "$RUNNER_TEMP/crossvex-mobile" > "$RUNNER_TEMP/mobile-http.log" 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8080/credits.html >/dev/null
          node scripts/run-release-mobile-preview.mjs
      - name: Save mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crossvex-mobile-preview
          path: |
            ${{ runner.temp }}/mobile-*.json
            ${{ runner.temp }}/mobile-*.png
            ${{ runner.temp }}/mobile-http.log
          if-no-files-found: warn
