name: Milovice 5.82 street-block photo WebGL
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'scripts/dev-check.mjs'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'scripts/dev-check.mjs'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  street-block-shard:
    name: Street WebGL ${{ matrix.shard }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [streets, districts]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser client
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-package-lock playwright-core@1.57.0
      - name: Verify geotagged streets and district geometry
        shell: bash
        env:
          STREET_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export CHROME_BIN
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/milovice-street-582-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/ >/dev/null
          case "$STREET_SHARD" in
            streets)
              node scripts/street-block-webgl.mjs
              ;;
            districts)
              node scripts/osm-vrutice-underground-surface-5281-webgl.mjs
              node scripts/osm-armadni-houses-5282-webgl.mjs
              ;;
            *) exit 2 ;;
          esac
      - name: Upload real 3D comparison images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milovice-street-58220-cameras-${{ matrix.shard }}
          path: browser-artifacts/
          if-no-files-found: ignore

  street-block-webgl:
    name: street-block-webgl
    needs: street-block-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require both WebGL shards to pass
        env:
          SHARDS_RESULT: ${{ needs.street-block-shard.result }}
        run: test "$SHARDS_RESULT" = success
