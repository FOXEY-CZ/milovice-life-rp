name: Milovice 5.82 street-block photo WebGL
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'scripts/dev-check.mjs'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'scripts/dev-check.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  street-block-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser client
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-package-lock playwright-core@1.57.0
      - name: Verify geotagged 5. května and Mírová views
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export CHROME_BIN
          python3 -m http.server 8080 >/tmp/milovice-street-582-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node scripts/street-block-webgl.mjs
          node scripts/osm-vrutice-underground-surface-5281-webgl.mjs
      - name: Upload real 3D comparison images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milovice-street-58220-cameras
          path: |
            browser-artifacts/milovice-street-58220-*.png
            browser-artifacts/vrutice-underground-5281-*.png
          if-no-files-found: ignore
