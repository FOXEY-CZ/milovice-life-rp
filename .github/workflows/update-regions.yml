name: Export expanded Milovice regions (OSM)
on:
  workflow_dispatch:
  push:
    paths:
      - data/regions/index.json
      - scripts/download_regions.py
      - .github/workflows/update-regions.yml
permissions:
  contents: write
concurrency:
  group: milovice-region-osm-export
  cancel-in-progress: true
jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate connected OSM subregions
        run: python3 scripts/download_regions.py
      - name: Store new OSM geometry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/regions/*.json
          if git diff --cached --quiet; then
            echo "No OSM changes"
          else
            git commit -m "data: expand mapped Milovice roads and buildings to Mladá, Vrutice and Boží Dar"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
