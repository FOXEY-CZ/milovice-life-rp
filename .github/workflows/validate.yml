name: Validate Milovice Life RP
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate HTML and JavaScript
        run: node scripts/validate.cjs
      - name: Validate REBUILD 2.0 all-region, all-object street coverage
        run: node scripts/rebuild2-street-inventory.test.mjs
      - name: Verify first Nádražní all-object photo survey and junction context
        run: node scripts/rebuild2-survey.test.mjs
      - name: Validate physical railway-side platform canopy and zero floating supports
        run: node scripts/station-platform-canopy.test.mjs
      - name: Validate actual photographed Milovice Bike Tower internal steelwork
        run: node scripts/bike-tower-interior.test.mjs
      - name: Verify glass / steel photo-lightening preserves original bike-tower and forecourt geometry
        run: node scripts/bike-tower-glass-5811.test.mjs
      - name: Verify corrected asphalt is world-aligned with no moved OSM roads or sidewalks
        run: node scripts/road-asphalt-world-uv-5813.test.mjs
      - name: Verify photo-documented Bike Tower entrance paving stays outside all mapped roads and footways
        run: node scripts/bike-tower-entry-paving.test.mjs
      - name: Verify continuous asymmetric forecourt really meshes as one connected upward surface
        run: node scripts/bike-tower-forecourt-mesh-5818.test.mjs
      - name: Verify safe close-up audit and compact mobile controls without any geometry changes
        run: node scripts/bike-tower-entry-inspection-5816.test.mjs
      - name: Prohibit unverified Nádražní garage objects without direct photographic evidence
        run: node scripts/photo-verification-policy.test.mjs
      - name: Identify the exact clicked 3D building from its mapped OSM footprint
        run: node scripts/osm-building-inspector.test.mjs
      - name: Validate 2022 photographed Nádražní garage rows and gravel yard
        run: node scripts/nadrazni-photo-garage-court.test.mjs
      - name: Validate adaptive mobile frame-rate and detail budgets
        run: node scripts/performance-governor.test.mjs
      - name: Validate ground-level thresholds at ALL building entrances
        run: node scripts/entrance-grade.test.mjs
      - name: Validate OSM school fence, actual driveway opening and planted grounds
        run: node scripts/school-grounds-pass.test.mjs
      - name: Validate next photographed Školská school street frontage
        run: node scripts/school-street-pass.test.mjs
      - name: Verify new photographed fork gable on actual OSM polygon
        run: node scripts/fork-gable-house.test.mjs
      - name: Validate photo-anchored Školská 220/1 street-facing openings
        run: node scripts/source-observed-facades.test.mjs
      - name: Validate photographed street block and mapped building IDs
        run: node scripts/street-photo-block.test.mjs
      - name: Verify 5.83 mass reconstruction prioritizes 24 real OSM homes within current mobile budget
        run: node scripts/street-mass-build-pass.test.mjs
      - name: Verify shared facade textures stay deterministic and phone-friendly
        run: node scripts/facade-surface-kit.test.mjs
      - name: Review whole-street Wikimedia photo provenance and coverage without false matches
        run: node scripts/street-photo-evidence.test.mjs
      - name: Validate photo-referenced whole-street environment and OSM alignment
        run: node scripts/street-environment-pass.test.mjs
      - name: Verify OSM-safe Pionýrů 2023 photo verge and junction reference
        run: node scripts/street-pionyru-photo-2023.test.mjs
      - name: Prevent roadside trees, lamps and fences from occupying OSM roads
        run: node scripts/road-clearance.test.mjs
      - name: Verify 360 reality audit OSM footway, station portals and actual crossings
        run: node scripts/reality-walkways.test.mjs
      - name: Reject legacy invented landmarks and unreviewed vegetation in old core
        run: node scripts/legacy-reality-audit.test.mjs
      - name: Verify photo-sourced station forecourt object clearances and OSM building anchors
        run: node scripts/station-forecourt-pass.test.mjs
      - name: Verify 2024 geotagged photo cameras, unchanged OSM anchors and single Bike Tower upper sign
        run: node scripts/station-forecourt-photo-audit.test.mjs
      - name: Validate two real orange/yellow PID ticket machines against the 2024 station-wall photograph
        run: node scripts/station-ticket-machines.test.mjs
      - name: Verify 2024 door, orange machine, yellow machine and rectangular window do not overlap
        run: node scripts/station-photo-facade.test.mjs
      - name: Preserve 5.79 station fixture positions while checking 5.80 visual detail and 4-draw budget
        run: node scripts/station-detail-580.test.mjs
      - name: Verify opt-in photo camera agrees with actual machine source and keeps parking untouched
        run: node scripts/station-ticket-photo-audit.test.mjs
      - name: Verify photographed 2024 station parking pavers on actual OSM access aisle
        run: node scripts/station-photo-parking.test.mjs
      - name: Verify opt-in Panoramax photo pilot cannot copy images or modify the game
        run: node scripts/panoramax-pilot.test.mjs
      - name: Verify OSM station roof facets do not overhang and preserve the real footprint
        run: node scripts/station-roof-geometry.test.mjs
      - name: Validate photographed roof gutter and fascia around real 22-edge school footprint
        run: node scripts/school-visible-eaves.test.mjs
      - name: Validate shared roof visibility from street level
        run: node scripts/roof-street-visibility.test.mjs
      - name: Validate real school footprint pitched roof against photographed source
        run: node scripts/school-roof.test.mjs
      - name: Validate every OSM house roof and photographed dormer angles across city
        run: node scripts/city-roof-geometry.test.mjs
      - name: Prevent elevated eaves and roof flaps on all new irregular buildings
        run: node scripts/perimeter-roof-envelope.test.mjs
      - name: Verify photo-specific Školská 220/1 roof and closed dormer gables
        run: node scripts/skolska-roof.test.mjs
      - name: Test universal roof cutouts around photographed gables in every orientation
        run: node scripts/roof-opening-geometry.test.mjs
      - name: Audit every mapped Milovice roof footprint and photo evidence
        run: node scripts/roof-system-batch.test.mjs
      - name: Validate Roof System 3.0 source-gated roof masses, U/L/T and passages
        run: node scripts/building-roof-topology.test.mjs
      - name: Confirm every short OSM exterior return has a solid wall
        run: node scripts/facade-perimeter.test.mjs
      - name: Audit every city window, door and plinth against physical OSM wall plane
        run: node scripts/facade-anchors.test.mjs
      - name: Verify no roof-to-wall gaps on irregular station footprints
        run: node scripts/station-roof-seams.test.mjs
      - name: Verify solid station eaves overhang only exterior mapped walls
        run: node scripts/station-roof-eaves.test.mjs
      - name: Reject repeat building selections and unsupported photo-to-building matches
        run: node scripts/building-work-progress.test.mjs
      - name: Verify building-by-building rebuild inventory covers all 684 core OSM structures
        run: node scripts/building-audit-queue.test.mjs
      - name: Validate historical station facade references and removal of wrong-side canopy
        run: node scripts/station-platform-reality.test.mjs
      - name: Validate permanent source-reviewed architecture and local preview overlays
        run: node scripts/architecture-manifest.test.mjs
      - name: Validate official Mapillary metadata discovery and per-street coverage
        run: node scripts/mapillary-discovery.test.mjs
      - name: Validate georeferenced facade viewpoints and continuous street walk
        run: node scripts/facade-review.test.mjs
      - name: Test local owned photo rectification and candidate detections
        run: node scripts/photo-survey.test.mjs
      - name: Validate each photo-reviewed facade's 3D geometry contract
        run: node scripts/facade-model.test.mjs
      - name: Test verified street editor architecture data bridge
        run: node scripts/street-architecture-test.mjs
      - name: Test OSM world collisions and station opening
        run: node scripts/collision-tests.mjs
      - name: Validate expanded Milovice districts and real elevation data
        run: python3 scripts/validate_regions.py
