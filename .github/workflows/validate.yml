name: Validate Milovice Life RP
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate HTML and JavaScript
        run: node scripts/validate.cjs
      - name: Verify terrain sampling and real DEM grid vertices
        run: node scripts/terrain-elevation.test.mjs
      - name: Check focused workstream runner interface
        run: node scripts/dev-check.mjs --list
      - name: Validate REBUILD 2.0 all-region, all-object street coverage
        run: node scripts/rebuild2-street-inventory.test.mjs
      - name: Validate 5.106 non-overlapping pedestrian joins in mapped Mladá estate
        run: node scripts/osm-mlada-footway-joins-5106.test.mjs
      - name: Validate 5.105 mapped Mladá apartment facades and non-overlapping panel grid
        run: node scripts/osm-mlada-residential-5105.test.mjs
