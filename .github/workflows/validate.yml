name: Validate Milovice Life RP
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate HTML and JavaScript
        run: node scripts/validate.cjs
      - name: Validate adaptive mobile frame-rate and detail budgets
        run: node scripts/performance-governor.test.mjs
      - name: Validate photographed street block and mapped building IDs
        run: node scripts/street-photo-block.test.mjs
      - name: Validate photo-referenced whole-street environment and OSM alignment
        run: node scripts/street-environment-pass.test.mjs
      - name: Prevent roadside trees, lamps and fences from occupying OSM roads
        run: node scripts/road-clearance.test.mjs
      - name: Verify 360 reality audit OSM footway, station portals and actual crossings
        run: node scripts/reality-walkways.test.mjs
      - name: Reject legacy invented landmarks and unreviewed vegetation in old core
        run: node scripts/legacy-reality-audit.test.mjs
      - name: Verify photo-sourced station forecourt object clearances and OSM building anchors
        run: node scripts/station-forecourt-pass.test.mjs
      - name: Validate 2025 station platform steel canopy and source-based roof form
        run: node scripts/station-platform-reality.test.mjs
      - name: Validate permanent source-reviewed architecture and local preview overlays
        run: node scripts/architecture-manifest.test.mjs
      - name: Validate official Mapillary metadata discovery and per-street coverage
        run: node scripts/mapillary-discovery.test.mjs
      - name: Validate georeferenced facade viewpoints and continuous street walk
        run: node scripts/facade-review.test.mjs
      - name: Test local owned photo rectification and candidate detections
        run: node scripts/photo-survey.test.mjs
      - name: Validate each photo-reviewed facade's 3D geometry contract
        run: node scripts/facade-model.test.mjs
      - name: Test verified street editor architecture data bridge
        run: node scripts/street-architecture-test.mjs
      - name: Test OSM world collisions and station opening
        run: node scripts/collision-tests.mjs
      - name: Validate expanded Milovice districts and real elevation data
        run: python3 scripts/validate_regions.py
