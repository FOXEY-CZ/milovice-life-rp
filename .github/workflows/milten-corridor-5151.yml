name: Milten 5.151 photo-supported court corridor mobile WebGL
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/osm-milten-photo-corridor-5151.js'
      - 'scripts/osm-milten-photo-corridor-5151.test.mjs'
      - 'scripts/osm-milten-photo-corridor-webgl-5151.mjs'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  photo-court-corridor:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify exactly sourced court/hall with photo-inferred visual corridor
        run: |
          node scripts/osm-sportovni-tennis-5150.test.mjs
          node scripts/osm-milten-photo-corridor-5151.test.mjs
      - run: npm install --no-save --no-package-lock playwright-core
      - name: Run mobile Chromium WebGL after 6.5-second LOD
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/milovice-http.log 2>&1 &
          node scripts/osm-milten-photo-corridor-webgl-5151.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milten-photo-court-corridor-5151
          path: browser-artifacts/milten-photo-corridor-fence-5151-mobile.png
          if-no-files-found: ignore
