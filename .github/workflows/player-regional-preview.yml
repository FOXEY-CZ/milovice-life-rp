name: Staged regional preview (evidence only)
on:
  push:
    branches: [prep/release-regional-candidate, prep/player-foot-job-candidate-5346]
    paths:
      - '.github/workflows/player-regional-preview.yml'
      - 'scripts/release-region-scenario.mjs'
      - 'scripts/osm-topolova-foot-lifecycle-5183.test.mjs'
      - 'scripts/osm-topolova-foot-job-5179.js'
      - 'scripts/osm-topolova-foot-job-5179.test.mjs'
      - 'scripts/run-release-regional-preview.mjs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/player-regional-preview.yml'
      - 'scripts/release-region-scenario.mjs'
      - 'scripts/osm-topolova-foot-lifecycle-5183.test.mjs'
      - 'scripts/osm-topolova-foot-job-5179.js'
      - 'scripts/osm-topolova-foot-job-5179.test.mjs'
      - 'scripts/run-release-regional-preview.mjs'
      - 'scripts/stage-player-package.mjs'
      - 'scripts/audit-release-map-data.mjs'
      - 'scripts/audit-release-network.mjs'
      - 'scripts/release-network-observer.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regional-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        group: [central, west, north]
    env:
      REGION_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage candidate and run regional browser scenarios
        shell: bash
        run: |
          set -euo pipefail
          node scripts/osm-topolova-foot-lifecycle-5183.test.mjs
          node scripts/osm-topolova-foot-job-5179.test.mjs
          node scripts/stage-player-package.mjs --stage "$RUNNER_TEMP/crossvex-regional"
          node scripts/audit-release-map-data.mjs "$RUNNER_TEMP/crossvex-regional"
          npm install --no-save --no-package-lock playwright-core@1.57.0
          python3 -m http.server 8080 --bind 127.0.0.1 --directory "$RUNNER_TEMP/crossvex-regional" > "$RUNNER_TEMP/regional-http.log" 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8080/credits.html >/dev/null
          node scripts/run-release-regional-preview.mjs
      - name: Save regional evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crossvex-regional-${{ matrix.group }}
          path: |
            ${{ runner.temp }}/regional-*.json
            ${{ runner.temp }}/regional-http.log
          if-no-files-found: warn
