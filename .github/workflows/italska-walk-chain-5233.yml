name: Milovice 5.233 source-locked Italska sidewalk chain mobile WebGL
on:
  push:
    paths:
      - index.html
      - data/regions/mlada.json
      - scripts/osm-italska-walk-chain-5233.js
      - scripts/osm-italska-flat-roof-5232.test.mjs
      - scripts/osm-italska-walk-chain-5233.test.mjs
      - scripts/osm-italska-walk-chain-webgl-5233.mjs
      - .github/workflows/italska-walk-chain-5233.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-pedestrian-graph-and-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source GPS chain and previous Italska roof regression
        run: |
          node scripts/osm-italska-flat-roof-5232.test.mjs
          node scripts/osm-italska-walk-chain-5233.test.mjs
      - run: npm install --no-save --no-package-lock playwright-core
      - name: Real mobile Chrome SwiftShader original sidewalk 6.5s LOD
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/milovice-http.log 2>&1 &
          node scripts/osm-italska-walk-chain-webgl-5233.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: italska-walk-chain-5233
          path: browser-artifacts/italska-walk-chain-5233-mobile.png
          if-no-files-found: ignore
