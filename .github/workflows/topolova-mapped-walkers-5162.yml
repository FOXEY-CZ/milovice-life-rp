name: Milovice 5.162 mapped pedestrian NPCs Topolova footway
on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 2'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/osm-topolova-mapped-walkers-5162.js'
      - 'scripts/osm-topolova-mapped-walkers-5162.test.mjs'
      - 'scripts/osm-topolova-mapped-walkers-webgl-5162.mjs'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  mapped-walkers:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact OSM pedestrian graph and previous facade regressions
        run: |
          node scripts/osm-topolova-mapped-walkers-5162.test.mjs
          node scripts/osm-topolova-estimated-facades-5161.test.mjs
          node scripts/osm-topolova-continuous-hip-5160.test.mjs
      - run: npm install --no-save --no-package-lock playwright-core
      - name: Mobile Chrome/WebGL after 7.35 s and animated pedestrian movement
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/milovice-http.log 2>&1 &
          node scripts/osm-topolova-mapped-walkers-webgl-5162.mjs
          node scripts/osm-topolova-estimated-facades-webgl-5161.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topolova-mapped-walkers-5162
          path: browser-artifacts/*5162-mobile.png
          if-no-files-found: ignore
