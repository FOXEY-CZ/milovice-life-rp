  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  webgl-shard:
    name: WebGL shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check both Italska blocks, material cache and original Visnova facades
        if: matrix.shard == 1
        run: |
          node --check scripts/osm-italska-encounter-webgl-5259.mjs
          node --check scripts/osm-kastanova-source-setts-webgl-5261.mjs
          node --check scripts/osm-italska-photo-red-plinth-webgl-5262.mjs
          node --check scripts/osm-italska-photo-red-plinth-5262.js
          node --check scripts/osm-rakouska-photo-upper-5263.js
          node --check scripts/osm-rakouska-photo-upper-webgl-5263.mjs
          node --check scripts/osm-rakouska-upper-windows-5264.js
          node --check scripts/osm-rakouska-upper-windows-webgl-5264.mjs
          node --check scripts/osm-rakouska-glazed-entry-5265.js
          node --check scripts/osm-rakouska-glazed-entry-webgl-5265.mjs
          node --check scripts/osm-rakouska-fenced-frontage-5266.js
          node --check scripts/osm-rakouska-fenced-frontage-webgl-5266.mjs
          node --check scripts/osm-pod-lesem-municipal-crossing-5270.js
          node --check scripts/osm-pod-lesem-municipal-crossing-webgl-5270.mjs
          node --check scripts/osm-pod-lesem-road-bends-5272.js
          node --check scripts/osm-pod-lesem-road-bends-webgl-5272.mjs
          node --check scripts/osm-pod-lesem-track-5273.js
          node --check scripts/osm-pod-lesem-track-webgl-5273.mjs
          node --check scripts/osm-pod-lesem-sidewalk-chain-5277.js
          node --check scripts/osm-pod-lesem-west-join-5278.js
          node --check scripts/osm-pod-lesem-crossing-walker-5275.js
          node --check scripts/osm-pod-lesem-crossing-walker-webgl-5275.mjs
          node --check scripts/osm-rakouska-granite-5269.js
          node --check scripts/osm-rakouska-granite-webgl-5269.mjs
          node --check scripts/osm-rakouska-walk-link-5268.js
          node --check scripts/osm-rakouska-walk-link-webgl-5268.mjs
          node --check scripts/osm-rakouska-cross-frontage-5267.js
          node --check scripts/osm-rakouska-cross-frontage-webgl-5267.mjs
          node scripts/osm-pod-lesem-municipal-crossing-5270.test.mjs
          node scripts/osm-pod-lesem-road-bends-5272.test.mjs
          node scripts/osm-pod-lesem-track-5273.test.mjs
          node scripts/osm-pod-lesem-crossing-walker-5275.test.mjs
          node scripts/osm-pod-lesem-sidewalk-chain-5277.test.mjs
          node scripts/osm-pod-lesem-west-join-5278.test.mjs
          node scripts/osm-rakouska-granite-5269.test.mjs
          node scripts/osm-rakouska-walk-link-5268.test.mjs
          node scripts/osm-topolova-foot-lifecycle-5183.test.mjs
          node scripts/osm-visnova-tagged-colors-5217.test.mjs
          node scripts/osm-rakouska-cross-frontage-5267.test.mjs
          node scripts/osm-rakouska-fenced-frontage-5266.test.mjs
          node scripts/osm-rakouska-glazed-entry-5265.test.mjs
          node scripts/osm-rakouska-upper-windows-5264.test.mjs
          node scripts/osm-rakouska-photo-upper-5263.test.mjs
          node scripts/osm-italska-photo-red-plinth-5262.test.mjs
          node scripts/osm-kastanova-source-setts-5261.test.mjs
          node --check scripts/osm-italska-body-envelope-5260.js
          node scripts/osm-italska-body-envelope-5260.test.mjs
          node scripts/osm-italska-junction-conflict-5258.test.mjs
          node scripts/osm-italska-strip-wheel-height-5257.test.mjs
          node scripts/osm-italska-rendered-strip-safety-5256.test.mjs
          node scripts/osm-italska-junction-smoothing-5255.test.mjs
          node scripts/osm-italska-turn-envelope-5254.test.mjs
          node scripts/osm-italska-car-clearance-5254.test.mjs
          node scripts/osm-italska-narrow-npc-5253.test.mjs
          node scripts/osm-italska-road-sidewalk-5252.test.mjs
          node scripts/osm-rakouska-north-photo-5251.test.mjs
          node scripts/osm-italska-photo-sightlines-5250.test.mjs
          node scripts/osm-italska-vojen-zatisi-5249.test.mjs
          node scripts/osm-ambient-road-clearance-5247.test.mjs
          node scripts/osm-ambient-continuity-5246.test.mjs
          node scripts/osm-ambient-building-clearance-5245.test.mjs
          node scripts/osm-ambient-reuse-5244.test.mjs
          node scripts/osm-mapped-ambient-walkers-5243.test.mjs
          node scripts/osm-italska-west-residence-5242.test.mjs
          node scripts/osm-traffic-continuity-5241.test.mjs
          node scripts/osm-traffic-access-5240.test.mjs
          node scripts/osm-visnova-residential-5192.test.mjs
          node scripts/osm-italska-apartments-5235.test.mjs
          node scripts/osm-italska-tower-5238.test.mjs
          node scripts/osm-italska-west-block-5239.test.mjs
          node scripts/osm-italska-walkers-5234.test.mjs
      - run: npm install --no-save --no-package-lock playwright-core
      - name: Actual mobile Chromium SwiftShader facades, full building-edge clearance and 6.5s LOD
        env:
          CHROME_BIN: /usr/bin/google-chrome
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/milovice-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/ >/dev/null
          case "${{ matrix.shard }}" in
            1)
              node scripts/osm-italska-apartments-webgl-5235.mjs
              node scripts/osm-italska-tower-webgl-5238.mjs
              node scripts/osm-italska-west-block-webgl-5239.mjs
              node scripts/osm-italska-west-residence-webgl-5242.mjs
              node scripts/osm-italska-vojen-zatisi-webgl-5249.mjs
              node scripts/osm-rakouska-north-photo-webgl-5251.mjs
              node scripts/osm-italska-road-sidewalk-webgl-5252.mjs
              node scripts/osm-italska-narrow-npc-webgl-5253.mjs
              ;;
            2)
              node scripts/osm-italska-car-clearance-webgl-5254.mjs
              node scripts/osm-italska-encounter-webgl-5259.mjs
              node scripts/osm-kastanova-source-setts-webgl-5261.mjs
              node scripts/osm-pod-lesem-municipal-crossing-webgl-5270.mjs
              node scripts/osm-pod-lesem-road-bends-webgl-5272.mjs
              node scripts/osm-pod-lesem-track-webgl-5273.mjs
              node scripts/osm-pod-lesem-crossing-walker-webgl-5275.mjs
              ;;
            3)
              node scripts/osm-rakouska-granite-webgl-5269.mjs
              node scripts/osm-rakouska-walk-link-webgl-5268.mjs
              node scripts/osm-rakouska-cross-frontage-webgl-5267.mjs
              node scripts/osm-rakouska-fenced-frontage-webgl-5266.mjs
              node scripts/osm-rakouska-glazed-entry-webgl-5265.mjs
              node scripts/osm-rakouska-upper-windows-webgl-5264.mjs
              node scripts/osm-rakouska-photo-upper-webgl-5263.mjs
              node scripts/osm-italska-photo-red-plinth-webgl-5262.mjs
              ;;
            *) exit 2 ;;
          esac
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: italska-apartments-5235-${{ matrix.shard }}
          path: browser-artifacts/
          if-no-files-found: ignore

  exact-osm-apartments-and-mobile:
    name: exact-osm-apartments-and-mobile
    needs: webgl-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every WebGL shard to pass
        env:
          SHARDS_RESULT: ${{ needs.webgl-shard.result }}
        run: test "$SHARDS_RESULT" = success
