name: Milovice 5.249 photo-backed historical Italská and mobile WebGL
on:
  push:
    paths:
      - index.html
      - data/regions/mlada.json
      - scripts/osm-italska-apartments-5235.js
      - scripts/osm-italska-apartments-5235.test.mjs
      - scripts/osm-italska-tower-5238.js
      - scripts/osm-italska-tower-5238.test.mjs
      - scripts/osm-italska-tower-webgl-5238.mjs
      - scripts/osm-italska-west-block-5239.js
      - scripts/osm-italska-west-block-5239.test.mjs
      - scripts/osm-italska-west-block-webgl-5239.mjs
      - scripts/osm-traffic-access-5240.js
      - scripts/osm-traffic-access-5240.test.mjs
      - scripts/osm-traffic-continuity-5241.js
      - scripts/osm-traffic-continuity-5241.test.mjs
      - scripts/osm-italska-west-residence-5242.js
      - scripts/osm-italska-west-residence-5242.test.mjs
      - scripts/osm-italska-west-residence-webgl-5242.mjs
      - scripts/osm-mapped-ambient-walkers-5243.js
      - scripts/osm-mapped-ambient-walkers-5243.test.mjs
      - scripts/osm-ambient-reuse-5244.js
      - scripts/osm-ambient-reuse-5244.test.mjs
      - scripts/osm-ambient-building-clearance-5245.js
      - scripts/osm-ambient-building-clearance-5245.test.mjs
      - scripts/osm-italska-vojen-zatisi-5249.js
      - scripts/osm-italska-vojen-zatisi-5249.test.mjs
      - scripts/osm-italska-vojen-zatisi-webgl-5249.mjs
      - scripts/osm-ambient-road-clearance-5247.js
      - scripts/osm-ambient-road-clearance-5247.test.mjs
      - scripts/osm-ambient-continuity-5246.js
      - scripts/osm-ambient-continuity-5246.test.mjs
      - scripts/reality-walkways.js
      - scripts/road-clearance.js
      - scripts/osm-italska-apartments-webgl-5235.mjs
      - scripts/osm-visnova-residential-5192.js
      - scripts/osm-visnova-residential-5192.test.mjs
      - .github/workflows/italska-apartments-5235.yml
  pull_request:
    branches: [main]
    paths:
      - index.html
      - scripts/osm-ambient-*.js
      - scripts/osm-ambient-*.test.mjs
      - scripts/osm-mapped-ambient-walkers-5243.js
      - scripts/osm-mapped-ambient-walkers-5243.test.mjs
      - scripts/osm-italska-west-residence-webgl-5242.mjs
      - scripts/osm-italska-vojen-zatisi-5249.js
      - scripts/osm-italska-vojen-zatisi-5249.test.mjs
      - scripts/osm-italska-vojen-zatisi-webgl-5249.mjs
      - .github/workflows/italska-apartments-5235.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-osm-apartments-and-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check both Italska blocks, material cache and original Visnova facades
        run: |
          node scripts/osm-italska-vojen-zatisi-5249.test.mjs
          node scripts/osm-ambient-road-clearance-5247.test.mjs
          node scripts/osm-ambient-continuity-5246.test.mjs
          node scripts/osm-ambient-building-clearance-5245.test.mjs
          node scripts/osm-ambient-reuse-5244.test.mjs
          node scripts/osm-mapped-ambient-walkers-5243.test.mjs
          node scripts/osm-italska-west-residence-5242.test.mjs
          node scripts/osm-traffic-continuity-5241.test.mjs
          node scripts/osm-traffic-access-5240.test.mjs
          node scripts/osm-visnova-residential-5192.test.mjs
          node scripts/osm-italska-apartments-5235.test.mjs
          node scripts/osm-italska-tower-5238.test.mjs
          node scripts/osm-italska-west-block-5239.test.mjs
          node scripts/osm-italska-walkers-5234.test.mjs
      - run: npm install --no-save --no-package-lock playwright-core
      - name: Actual mobile Chromium SwiftShader facades, full building-edge clearance and 6.5s LOD
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/milovice-http.log 2>&1 &
          node scripts/osm-italska-apartments-webgl-5235.mjs
          node scripts/osm-italska-tower-webgl-5238.mjs
          node scripts/osm-italska-west-block-webgl-5239.mjs
          node scripts/osm-italska-west-residence-webgl-5242.mjs
          node scripts/osm-italska-vojen-zatisi-webgl-5249.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: italska-apartments-5235
          path: |
            browser-artifacts/italska-apartments-5235-mobile.png
            browser-artifacts/italska-tower-5238-mobile.png
            browser-artifacts/italska-west-block-5239-mobile.png
            browser-artifacts/italska-west-residence-5242-mobile.png
            browser-artifacts/italska-vojen-zatisi-5249-mobile.png
          if-no-files-found: ignore
