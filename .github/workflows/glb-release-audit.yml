name: GLB evidence audit (preview only)
on:
  push:
    branches: [prep/glb-release-audit, prep/release-model-candidate, prep/player-vehicle-candidate-5345]
    paths:
      - 'scripts/audit-release-glb.mjs'
      - '.github/workflows/glb-release-audit.yml'
      - 'scripts/human-assets.js'
      - 'scripts/nature-assets.js'
      - 'scripts/vehicle-assets.js'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audit-release-glb.mjs'
      - '.github/workflows/glb-release-audit.yml'
      - 'scripts/human-assets.js'
      - 'scripts/nature-assets.js'
      - 'scripts/vehicle-assets.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock three@0.160.1
      - run: node scripts/audit-release-glb.mjs --check-runtime "$RUNNER_TEMP/glb-runtime-registry.json"
      - run: node scripts/audit-release-glb.mjs --self-test
      - run: node scripts/audit-release-glb.mjs --audit "$RUNNER_TEMP/glb-evidence.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glb-evidence-review-pending
          path: |
            ${{ runner.temp }}/glb-evidence.json
            ${{ runner.temp }}/glb-runtime-registry.json

  upstream-originals:
    # External provider availability is not a gameplay regression. Manual release evidence only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit-release-glb.mjs --compare-cars "$RUNNER_TEMP/glb-original-cars.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glb-original-cars-review-pending
          path: ${{ runner.temp }}/glb-original-cars.json
