name: GLB evidence audit (preview only)
on:
  push:
    branches: [prep/glb-release-audit]
    paths:
      - 'scripts/audit-release-glb.mjs'
      - '.github/workflows/glb-release-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit-release-glb.mjs --self-test
      - run: node scripts/audit-release-glb.mjs --audit "$RUNNER_TEMP/glb-evidence.json"
      - run: node scripts/audit-release-glb.mjs --compare-cars "$RUNNER_TEMP/glb-original-cars.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glb-evidence-review-pending
          path: |
            ${{ runner.temp }}/glb-evidence.json
            ${{ runner.temp }}/glb-original-cars.json
