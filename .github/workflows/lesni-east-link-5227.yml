name: Milovice 5.227 original Lesni east sidewalk mobile WebGL
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 2'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/osm-lesni-east-link-5227.js'
      - 'scripts/osm-lesni-east-link-5227.test.mjs'
      - 'scripts/osm-lesni-east-link-webgl-5227.mjs'
      - 'scripts/osm-lesni-footway-branches-5226.test.mjs'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source-and-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact GPS crossing connections and regression 5.226
        run: |
          node scripts/osm-lesni-footway-branches-5226.test.mjs
          node scripts/osm-lesni-east-link-5227.test.mjs
      - run: npm install --no-save --no-package-lock playwright-core
      - name: Actual mobile Chromium WebGL, neutral sidewalk and LOD
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/milovice-http.log 2>&1 &
          node scripts/osm-lesni-east-link-webgl-5227.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lesni-east-link-5227
          path: browser-artifacts/lesni-east-link-5227-mobile.png
          if-no-files-found: ignore
