name: Milovice 5.229 original Lesni north pedestrian branches mobile WebGL
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 4'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/osm-lesni-north-branches-5229.js'
      - 'scripts/osm-lesni-north-branches-5229.test.mjs'
      - 'scripts/osm-lesni-north-branches-webgl-5229.mjs'
      - 'scripts/osm-visnova-long-sidewalk-5228.test.mjs'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source-and-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source-locked original GPS joins and 5.228 regression
        run: |
          node scripts/osm-visnova-long-sidewalk-5228.test.mjs
          node scripts/osm-lesni-north-branches-5229.test.mjs
      - run: npm install --no-save --no-package-lock playwright-core
      - name: Real mobile Chromium SwiftShader WebGL and LOD
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/milovice-http.log 2>&1 &
          node scripts/osm-lesni-north-branches-webgl-5229.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lesni-north-branches-5229
          path: browser-artifacts/lesni-north-branches-5229-mobile.png
          if-no-files-found: ignore
