name: Milovice Topolova verified street and DEM regression
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 6'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/osm-clay-court-grain-5178.js'
      - 'scripts/osm-clay-court-grain-5178.test.mjs'
      - 'scripts/osm-topolova-foot-lifecycle-5183.test.mjs'
      - 'scripts/osm-topolova-foot-path-highlight-5182.js'
      - 'scripts/osm-topolova-foot-path-highlight-5182.test.mjs'
      - 'scripts/osm-topolova-foot-minimap-5181.js'
      - 'scripts/osm-topolova-foot-minimap-5181.test.mjs'
      - 'scripts/osm-topolova-foot-navigation-5180.js'
      - 'scripts/osm-topolova-foot-navigation-5180.test.mjs'
      - 'scripts/osm-topolova-foot-job-5179.js'
      - 'scripts/osm-topolova-foot-job-5179.test.mjs'
      - 'scripts/osm-topolova-paving-5177.js'
      - 'scripts/osm-topolova-paving-5177.test.mjs'
      - 'scripts/osm-topolova-west-walker-5175.js'
      - 'scripts/osm-topolova-west-walker-5175.test.mjs'
      - 'scripts/osm-topolova-pedestrian-topology-5174.js'
      - 'scripts/osm-topolova-pedestrian-topology-5174.test.mjs'
      - 'scripts/osm-topolova-street-inventory-5173.js'
      - 'scripts/osm-topolova-street-inventory-5173.test.mjs'
      - 'scripts/osm-topolova-estimated-facades-5161.js'
      - 'scripts/osm-topolova-estimated-facades-5161.test.mjs'
      - 'scripts/osm-topolova-entry-survey-5170.js'
      - 'scripts/osm-topolova-entry-survey-5170.test.mjs'
      - 'scripts/osm-topolova-entry-survey-webgl-5170.mjs'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source-and-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Actual RUIAN grade/cameras and full five-house regressions
        run: |
          node scripts/osm-topolova-street-inventory-5173.test.mjs
          node scripts/osm-topolova-pedestrian-topology-5174.test.mjs
          node scripts/osm-topolova-west-walker-5175.test.mjs
          node scripts/osm-topolova-paving-5177.test.mjs
          node scripts/osm-topolova-foot-job-5179.test.mjs
          node scripts/osm-topolova-foot-navigation-5180.test.mjs
          node scripts/osm-topolova-foot-minimap-5181.test.mjs
          node scripts/osm-topolova-foot-path-highlight-5182.test.mjs
          node scripts/osm-topolova-foot-lifecycle-5183.test.mjs
          node scripts/osm-clay-court-grain-5178.test.mjs
          node scripts/osm-topolova-entry-survey-5170.test.mjs
          node scripts/osm-topolova-end-gables-5169.test.mjs
          node scripts/osm-topolova-estimated-facades-5161.test.mjs
          node scripts/osm-topolova-continuous-hip-5160.test.mjs
      - run: npm install --no-save --no-package-lock playwright-core
      - name: Mobile Chromium WebGL 8.5s LOD and entry grade survey
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/milovice-http.log 2>&1 &
          node scripts/osm-topolova-entry-survey-webgl-5170.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topolova-entry-survey-5170
          path: browser-artifacts/topolova-entry-survey-5170-mobile.png
          if-no-files-found: ignore
