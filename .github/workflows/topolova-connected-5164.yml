name: Milovice 5.164 connected OSM footway NPC corner
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/osm-topolova-connected-5164.js'
      - 'scripts/osm-topolova-connected-5164.test.mjs'
      - 'scripts/osm-topolova-connected-webgl-5164.mjs'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source-and-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: GPS source join, 10-segment polyline, previous building/unit regressions
        run: |
          node scripts/osm-topolova-connected-5164.test.mjs
          node scripts/osm-topolova-promenade-5163.test.mjs
          node scripts/osm-topolova-mapped-walkers-5162.test.mjs
          node scripts/osm-topolova-estimated-facades-5161.test.mjs
          node scripts/osm-topolova-continuous-hip-5160.test.mjs
      - run: npm install --no-save --no-package-lock playwright-core
      - name: Mobile Chromium WebGL 7.5s LOD and physical junction turn
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/milovice-http.log 2>&1 &
          node scripts/osm-topolova-connected-webgl-5164.mjs
          node scripts/osm-topolova-promenade-webgl-5163.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topolova-connected-5164
          path: browser-artifacts/*5164-mobile.png
          if-no-files-found: ignore
