name: Milovice 5.101 compact audit menu
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 4'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/street-audit-menu-5101.js'
      - 'scripts/street-audit-menu-webgl-5101.mjs'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify-compact-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test client
        run: npm install --no-save --no-package-lock playwright-core@1.57.0
      - name: Verify compact mobile and desktop menus in real Chromium
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export CHROME_BIN
          python3 -m http.server 8080 >/tmp/milovice-audit-menu-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node scripts/street-audit-menu-webgl-5101.mjs
      - name: Upload real mobile menu screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milovice-street-audit-menu-5101
          path: browser-artifacts/street-audit-menu-5101-*.png
          if-no-files-found: ignore
