name: Milovice 5.155 Topolova 614-618 source-verified panel row
on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 5'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/osm-topolova-panel-row-5155.js'
      - 'scripts/osm-topolova-panel-row-5155.test.mjs'
      - 'scripts/osm-topolova-panel-row-webgl-5155.mjs'
      - 'scripts/osm-ruian-party-walls-webgl-5133.mjs'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  row-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: OSM source and party wall regression
        run: |
          node scripts/osm-topolova-panel-row-5155.test.mjs
          node scripts/osm-ruian-party-walls-5133.test.mjs
          node scripts/osm-slunicko-west-elevation-5154.test.mjs
      - run: npm install --no-save --no-package-lock playwright-core
      - name: Mobile Chromium/WebGL after 6.5-second LOD
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/milovice-http.log 2>&1 &
          node scripts/osm-topolova-panel-row-webgl-5155.mjs
          node scripts/osm-ruian-party-walls-webgl-5133.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topolova-panel-row-5155-mobile
          path: browser-artifacts/*5155-mobile.png
          if-no-files-found: ignore
