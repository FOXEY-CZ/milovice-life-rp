<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Milovice Life RP</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101e2b;color:white;font:14px system-ui;overflow:hidden;touch-action:none;user-select:none}#hud{position:absolute;top:10px;left:10px;background:#102337e8;padding:12px;border-radius:12px;max-width:300px}h2{margin:0 0 7px}p{margin:5px 0}#controls{position:absolute;bottom:8px;left:1%;width:98%;display:flex;gap:5px;flex-wrap:wrap;justify-content:center;background:#13293ce8;border-radius:12px;padding:7px}button{background:#285275;color:white;border:1px solid #779bb7;border-radius:8px;min-height:50px;min-width:55px;flex:1;touch-action:none;font-weight:bold}button:active{background:#468bb9}#tip{position:absolute;right:10px;top:10px;background:#102337c9;padding:10px;border-radius:9px}@media(max-width:650px){#hud{font-size:11px;padding:8px;max-width:65vw}#tip{display:none}button{font-size:12px;min-width:0}}</style></head><body>
<div id="hud"><h2>🚌 MILOVICE LIFE RP</h2><p>Modelové Milovice · Singleplayer</p><p>Linka 432 · <span id="mode">Autobus</span></p><p>Rychlost: <b id="speed">0</b> km/h · Cestující: <b id="pass">0</b></p><p>Zastávka: <b id="stop">Milovice, žel. st.</b></p><p>Odměny: <b id="money">0</b> Kč</p><p id="status">Vyjeď na trasu!</p></div>
<div id="tip">WASD / šipky · E nastoupit/vystoupit · mezerník dveře · C kamera · R reset</div>
<div id="controls"><button data-key="KeyA">◀</button><button data-key="KeyW">▲ Plyn</button><button data-key="KeyS">▼ Brzda / R</button><button data-key="KeyD">▶</button><button id="enter">🚶 Vystoupit</button><button id="doors">🚪 Dveře</button><button id="camera">📷 Kamera</button><button id="reset">↺ Reset</button></div>
<script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new T.Scene();scene.background=new T.Color(0x9dc8e6);scene.fog=new T.Fog(0x9dc8e6,260,800);
const camera=new T.PerspectiveCamera(68,innerWidth/innerHeight,.1,1100);
const renderer=new T.WebGLRenderer({antialias:false,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);
scene.add(new T.HemisphereLight(0xffffff,0x61705a,2));const sun=new T.DirectionalLight(0xffeac5,1.5);sun.position.set(60,100,30);scene.add(sun);
const m=c=>new T.MeshLambertMaterial({color:c}), grass=m(0x72935e),asphalt=m(0x41464a),sidewalk=m(0xb5b5ae),line=m(0xf4ebd8),yellow=m(0xe9bf30),glass=m(0x548ca2),dark=m(0x242e34),rubber=m(0x191d20);
function box(w,h,d,mat,x,y,z,parent=scene){const o=new T.Mesh(new T.BoxGeometry(w,h,d),mat);o.position.set(x,y,z);parent.add(o);return o}
box(3000,.2,3000,grass,0,-.2,0);box(18,.1,420,asphalt,0,.01,-150);
for(let z=30;z>-365;z-=17)box(.17,.025,7,line,0,.08,z);
for(const x of [-11,11])box(2,.12,420,sidewalk,x,.03,-150);
for(const z of [-48,-155,-266]){box(270,.11,16,asphalt,0,.04,z);for(let x=-125;x<130;x+=15)if(Math.abs(x)>15)box(6,.02,.15,line,x,.12,z)}
const stops=[['Milovice, žel. st.',0],['Milovice, radnice',-105],['Milovice, Armádní',-210],['Milovice, Mirakulum',-320]];
for(const [name,z] of stops){box(4,.1,17,sidewalk,12,.12,z);box(.25,3,.25,m(0x225a8e),13,1.5,z);box(1.7,.85,.15,yellow,13,3.1,z);box(3,.15,2,dark,17,2.8,z);box(3,1.7,.1,glass,17,1.7,z+1)}
let seed=3456;function rand(){seed=seed*16807%2147483647;return seed/2147483647}
const walls=[m(0xd9c5ae),m(0xc0cbd0),m(0xe1d6c6),m(0xd7c0a9)],roof=m(0x69636a),windowMat=m(0x5d8798),tree=m(0x4c7b41),trunk=m(0x6c513b);
for(let z=-335;z<40;z+=27)for(const side of [-1,1]){const x=side*(32+rand()*12),h=6+Math.floor(rand()*4)*3,w=12+rand()*7,d=12+rand()*5;box(w,h,d,walls[Math.floor(rand()*4)],x,h/2,z);box(w+1,.5,d+1,roof,x,h+.3,z);for(let yy=2.3;yy<h;yy+=3)for(let xx=-w/2+2;xx<w/2-1;xx+=3.5)box(1.6,1.4,.12,windowMat,x+xx,yy,z-d/2-.1);if(rand()>.3){const tx=side*18;box(.5,3,.5,trunk,tx,1.5,z+8);const crown=new T.Mesh(new T.IcosahedronGeometry(2.7,0),tree);crown.position.set(tx,5,z+8);scene.add(crown)}}
const bus=new T.Group();scene.add(bus);box(2.5,1.95,8.7,yellow,0,1.55,0,bus);box(2.55,.35,8.8,m(0xf0d85c),0,2.64,0,bus);box(2.55,.14,8.8,m(0xd0d5d5),0,2.9,0,bus);box(2.4,1.05,.08,glass,0,2.2,-4.38,bus);box(2.4,.75,.08,glass,0,2.2,4.38,bus);
for(const side of [-1,1]){for(let i=0;i<6;i++)box(.055,.85,1.13,glass,side*1.28,2.18,-3.5+i*1.28,bus);for(const z of [-2.8,2.7]){const wheel=new T.Mesh(new T.CylinderGeometry(.54,.54,.32,18),rubber);wheel.rotation.z=Math.PI/2;wheel.position.set(side*1.34,.57,z);bus.add(wheel);const rim=new T.Mesh(new T.CylinderGeometry(.29,.29,.34,14),m(0x9ca6aa));rim.rotation.z=Math.PI/2;rim.position.copy(wheel.position);bus.add(rim)}box(.4,.4,.12,dark,side*1.55,2.45,-4.25,bus);box(.4,.25,.12,m(0xffedbc),side*1.0,1.15,-4.42,bus)}
const avatar=new T.Group();scene.add(avatar);box(.65,1.1,.35,m(0x316188),0,1.35,0,avatar);box(.4,.4,.4,m(0xe0aa80),0,2.15,0,avatar);for(const s of [-1,1])box(.23,.85,.27,dark,s*.2,.44,0,avatar);avatar.visible=false;
const $=id=>document.getElementById(id),keys=new Set();let x=-3,z=16,angle=0,speed=0,next=0,pass=0,walking=false,px=-6,pz=16,cam=0,open=false,paid=false,money=0;try{money=Number(localStorage.getItem('milovice_money')||0)||0}catch{}
function ui(msg){$('speed').textContent=Math.round(Math.abs(speed)*3.6);$('pass').textContent=pass;$('stop').textContent=stops[next]?.[0]||'Konečná';$('mode').textContent=walking?'Pěšky':'Autobus';$('money').textContent=money;$('enter').textContent=walking?'🚌 Nastoupit':'🚶 Vystoupit';if(msg)$('status').textContent=msg}
function enter(){if(!walking){if(Math.abs(speed)>.3)return ui('Nejdřív zastav!');walking=true;px=x-3;pz=z+2;avatar.visible=true;ui('Pěší režim. E pro nastoupení.')}else{if(Math.hypot(px-x,pz-z)>7)return ui('Přibliž se k autobusu.');walking=false;avatar.visible=false;ui('Nastoupil jsi.')}keys.clear()}
function doors(){if(walking)return ui('Nastup do autobusu.');if(Math.abs(speed)>.4)return ui('Nejdřív zastav!');open=!open;if(open&&next<stops.length&&Math.abs(z-stops[next][1])<13&&Math.abs(x+3)<6){pass+=2+next*2;ui('✅ Odbavena '+stops[next][0]);next++;if(next===stops.length&&!paid){paid=true;money+=700;try{localStorage.setItem('milovice_money',String(money))}catch{}ui('🏁 Linka dokončena! +700 Kč')}}else ui(open?'Dveře otevřeny':'Dveře zavřeny')}
function reset(){x=-3;z=16;angle=0;speed=0;next=0;pass=0;walking=false;open=false;paid=false;avatar.visible=false;keys.clear();ui('Nová jízda!')}
const alias={ArrowUp:'KeyW',ArrowDown:'KeyS',ArrowLeft:'KeyA',ArrowRight:'KeyD'};
document.addEventListener('keydown',e=>{const k=alias[e.code]||e.code;if(['KeyW','KeyA','KeyS','KeyD','Space'].includes(k))e.preventDefault();keys.add(k);if(!e.repeat){if(k==='KeyE')enter();if(k==='Space')doors();if(k==='KeyC')cam=(cam+1)%3;if(k==='KeyR')reset()}});document.addEventListener('keyup',e=>keys.delete(alias[e.code]||e.code));addEventListener('blur',()=>keys.clear());
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(k);b.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(k))});
$('enter').onclick=enter;$('doors').onclick=doors;$('camera').onclick=()=>cam=(cam+1)%3;$('reset').onclick=reset;
let last=performance.now();function frame(t){requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1000);last=t;if(walking){let dx=Number(keys.has('KeyD'))-Number(keys.has('KeyA')),dz=Number(keys.has('KeyS'))-Number(keys.has('KeyW'));const len=Math.hypot(dx,dz)||1;px+=dx/len*4.2*dt;pz+=dz/len*4.2*dt;avatar.position.set(px,0,pz);speed=0}else{if(open)speed+=Math.sign(-speed)*Math.min(Math.abs(speed),12*dt);else if(keys.has('KeyW')&&!keys.has('KeyS'))speed=Math.min(13,speed+6*dt);else if(keys.has('KeyS')&&!keys.has('KeyW'))speed=Math.max(-4.5,speed-12*dt);else speed+=Math.sign(-speed)*Math.min(Math.abs(speed),2.5*dt);const steer=Number(keys.has('KeyD'))-Number(keys.has('KeyA'));angle-=steer*(speed/13)*.95*dt;x-=Math.sin(angle)*speed*dt;z-=Math.cos(angle)*speed*dt}bus.position.set(x,0,z);bus.rotation.y=angle;const forward=new T.Vector3(-Math.sin(angle),0,-Math.cos(angle));let dest,target;if(walking){dest=new T.Vector3(px,3.5,pz+7);target=new T.Vector3(px,1.4,pz)}else if(cam===0){dest=new T.Vector3(x,5.5,z).addScaledVector(forward,-12);target=new T.Vector3(x,1.7,z).addScaledVector(forward,9)}else if(cam===1){dest=new T.Vector3(x,2.4,z).addScaledVector(forward,2.6);target=new T.Vector3(x,2.2,z).addScaledVector(forward,30)}else{dest=new T.Vector3(x+17,17,z+17);target=new T.Vector3(x,1,z)}camera.position.lerp(dest,Math.min(1,dt*8));camera.lookAt(target);ui();renderer.render(scene,camera)}requestAnimationFrame(frame);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
